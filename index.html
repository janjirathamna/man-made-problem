<!DOCTYPE html>
<html lang="th" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Non-Standard Problem Report & Dashboard</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              teal: '#00bba7',
              navy: '#0f172a',
              header: '#0c2340',
              accent: '#f59e0b'
            }
          }
        }
      }
    }
  </script>
  <!-- Icons & Libraries -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body class="bg-gray-100 dark:bg-slate-900 text-gray-800 dark:text-gray-100 transition-colors duration-200 min-h-screen">

  <!-- Header Panel (โทน Navy/Teal เดียวกับทีม) -->
  <header class="bg-[#0c2340] text-white p-4 shadow-md sticky top-0 z-50">
    <div class="max-w-7xl mx-auto flex flex-wrap justify-between items-center gap-4">
      <div class="flex items-center space-x-3">
        <i class="fa-solid fa-[#00bba7] fa-gear text-2xl text-teal-400"></i>
        <div>
          <h1 class="font-bold text-lg md:text-xl tracking-wide" id="t-title">Non-Standard Problem Report</h1>
          <p class="text-xs text-gray-300" id="t-subtitle">Man Problem Dashboard & Input System</p>
        </div>
      </div>

      <!-- Controls Right Header -->
      <div class="flex flex-wrap items-center gap-2">
        <button onclick="openModal()" class="bg-teal-600 hover:bg-teal-500 text-white px-3 py-1.5 rounded-lg text-sm font-semibold flex items-center gap-1.5 shadow">
          <i class="fa-solid fa-plus"></i> <span id="t-add-btn">+ Add Data</span>
        </button>

        <!-- Language Selector -->
        <div class="inline-flex rounded-md shadow-sm" role="group">
          <button onclick="setLanguage('en')" id="lang-en" class="px-2.5 py-1 text-xs font-bold bg-teal-700 text-white rounded-l-md">EN</button>
          <button onclick="setLanguage('zh')" id="lang-zh" class="px-2.5 py-1 text-xs font-bold bg-gray-700 text-white">中文</button>
          <button onclick="setLanguage('th')" id="lang-th" class="px-2.5 py-1 text-xs font-bold bg-gray-700 text-white rounded-r-md">TH</button>
        </div>

        <!-- Theme Toggle -->
        <button onclick="toggleTheme()" class="p-1.5 bg-gray-800 hover:bg-gray-700 rounded-md text-gray-200">
          <i class="fa-solid fa-circle-half-stroke text-sm"></i>
        </button>

        <!-- Export Buttons -->
        <button onclick="exportImage()" class="bg-slate-700 hover:bg-slate-600 text-xs px-2.5 py-1.5 rounded text-white flex items-center gap-1">
          <i class="fa-solid fa-image"></i> Save Image
        </button>
        <button onclick="exportCSV()" class="bg-slate-700 hover:bg-slate-600 text-xs px-2.5 py-1.5 rounded text-white flex items-center gap-1">
          <i class="fa-solid fa-file-csv"></i> CSV
        </button>
        <button onclick="exportPDF()" class="bg-slate-700 hover:bg-slate-600 text-xs px-2.5 py-1.5 rounded text-white flex items-center gap-1">
          <i class="fa-solid fa-file-pdf"></i> PDF
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto p-4 space-y-6" id="capture-area">
    
    <!-- Filter Bar -->
    <div class="bg-white dark:bg-slate-800 p-4 rounded-xl shadow flex flex-wrap gap-3 items-center justify-between text-sm">
      <div class="flex flex-wrap gap-2 items-center">
        <select id="filter-plant" onchange="applyFilters()" class="border dark:border-gray-600 bg-gray-50 dark:bg-slate-700 rounded-lg p-2">
          <option value="">All Plants</option>
        </select>
        <select id="filter-dept" onchange="applyFilters()" class="border dark:border-gray-600 bg-gray-50 dark:bg-slate-700 rounded-lg p-2">
          <option value="">All Depts</option>
        </select>
        <select id="filter-shift" onchange="applyFilters()" class="border dark:border-gray-600 bg-gray-50 dark:bg-slate-700 rounded-lg p-2">
          <option value="">All Shifts</option>
        </select>
      </div>
      <button onclick="resetFilters()" class="text-xs bg-gray-200 dark:bg-gray-700 px-3 py-2 rounded-lg hover:bg-gray-300 dark:hover:bg-gray-600">Reset</button>
    </div>

    <!-- Summary KPI Cards -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4" id="kpi-cards">
      <div class="bg-white dark:bg-slate-800 p-4 rounded-xl shadow border-l-4 border-teal-500">
        <p class="text-xs text-gray-500 dark:text-gray-400">Total Cases</p>
        <h3 class="text-2xl font-bold text-teal-600 dark:text-teal-400" id="kpi-total">0</h3>
      </div>
      <div class="bg-white dark:bg-slate-800 p-4 rounded-xl shadow border-l-4 border-amber-500">
        <p class="text-xs text-gray-500 dark:text-gray-400">Terahop 5000</p>
        <h3 class="text-2xl font-bold text-amber-500" id="kpi-terahop">0</h3>
      </div>
      <div class="bg-white dark:bg-slate-800 p-4 rounded-xl shadow border-l-4 border-purple-500">
        <p class="text-xs text-gray-500 dark:text-gray-400">Ayutthaya</p>
        <h3 class="text-2xl font-bold text-purple-500" id="kpi-ayutthaya">0</h3>
      </div>
      <div class="bg-white dark:bg-slate-800 p-4 rounded-xl shadow border-l-4 border-blue-500">
        <p class="text-xs text-gray-500 dark:text-gray-400">Other Plants</p>
        <h3 class="text-2xl font-bold text-blue-500" id="kpi-other">0</h3>
      </div>
    </div>

    <!-- Dashboard Chart -->
    <div class="bg-white dark:bg-slate-800 p-5 rounded-xl shadow">
      <h2 class="font-bold mb-4 text-base flex items-center gap-2">
        <i class="fa-solid fa-chart-bar text-teal-500"></i> <span id="t-chart-head">Issues per Machine Model</span>
      </h2>
      <div class="relative h-64 md:h-80">
        <canvas id="barChart"></canvas>
      </div>
    </div>

    <!-- Data Table -->
    <div class="bg-white dark:bg-slate-800 rounded-xl shadow overflow-hidden">
      <div class="p-4 border-b dark:border-gray-700 font-bold flex justify-between items-center">
        <span id="t-table-head">Issue Log Records</span>
        <span class="text-xs text-gray-400" id="row-count">0 items</span>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-sm text-left">
          <thead class="bg-gray-100 dark:bg-slate-700 text-xs uppercase">
            <tr>
              <th class="p-3">Shift</th>
              <th class="p-3">Plant</th>
              <th class="p-3">Machine Model</th>
              <th class="p-3">Time</th>
              <th class="p-3">Dept</th>
              <th class="p-3">Problem Found</th>
              <th class="p-3 text-center">Images</th>
            </tr>
          </thead>
          <tbody id="table-body" class="divide-y dark:divide-gray-700">
            <!-- Dynamic rows -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Modal Form -->
  <div id="formModal" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-50">
    <div class="bg-white dark:bg-slate-800 rounded-xl shadow-2xl max-w-lg w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b pb-3 dark:border-gray-700">
        <h3 class="font-bold text-lg" id="t-modal-title">Report New Issue</h3>
        <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 text-xl">&times;</button>
      </div>

      <form id="issueForm" onsubmit="submitForm(event)" class="space-y-3 text-sm">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block mb-1 font-semibold">Shift (班)</label>
            <input type="text" id="inp-shift" placeholder="e.g. 早 / 早班 / Night" class="w-full border rounded-lg p-2 dark:bg-slate-700 dark:border-gray-600" required>
          </div>
          <div>
            <label class="block mb-1 font-semibold">Plant</label>
            <input type="text" id="inp-plant" placeholder="e.g. Terahop 5000" class="w-full border rounded-lg p-2 dark:bg-slate-700 dark:border-gray-600" required>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block mb-1 font-semibold">Machine Model (设备型号)</label>
            <input type="text" id="inp-model" placeholder="e.g. ENG 2.0" class="w-full border rounded-lg p-2 dark:bg-slate-700 dark:border-gray-600" required>
          </div>
          <div>
            <label class="block mb-1 font-semibold">Dept.</label>
            <input type="text" id="inp-dept" placeholder="e.g. MFG" class="w-full border rounded-lg p-2 dark:bg-slate-700 dark:border-gray-600" required>
          </div>
        </div>

        <div>
          <label class="block mb-1 font-semibold">Adjust Time (调整时间)</label>
          <input type="text" id="inp-time" class="w-full border rounded-lg p-2 dark:bg-slate-700 dark:border-gray-600">
        </div>

        <div>
          <label class="block mb-1 font-semibold">Problem Found (发现的问题)</label>
          <textarea id="inp-problem" rows="3" class="w-full border rounded-lg p-2 dark:bg-slate-700 dark:border-gray-600" required></textarea>
        </div>

        <!-- Photo Upload -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block mb-1 text-xs font-semibold">Picture 1</label>
            <input type="file" id="inp-img1" accept="image/*" class="text-xs w-full">
          </div>
          <div>
            <label class="block mb-1 text-xs font-semibold">Picture 2</label>
            <input type="file" id="inp-img2" accept="image/*" class="text-xs w-full">
          </div>
        </div>

        <div class="pt-4 flex justify-end gap-2 border-t dark:border-gray-700">
          <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-lg bg-gray-200 dark:bg-gray-700">Cancel</button>
          <button type="submit" id="btn-submit" class="px-4 py-2 rounded-lg bg-teal-600 text-white font-semibold hover:bg-teal-500">Submit</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // 🔴 ใส่ Web App URL จาก Google Apps Script ตรงนี้
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzqf2flkrWTGQVCYjCvOCLVFPMXzW86ioN1xZZt7j3Ydk6Up0S2ypjOcYDZVRV-TXpO4Q/exec";

    let rawData = [];
    let myChart = null;
    let currentLang = 'en';

    const dict = {
      en: {
        title: "Non-Standard Problem Report",
        addBtn: "+ Add Data",
        chartHead: "Issues per Machine Model",
        tableHead: "Issue Log Records",
        modalTitle: "Report New Issue"
      },
      zh: {
        title: "非标准问题报告 Dashboard",
        addBtn: "+ 添加数据",
        chartHead: "各设备型号问题统计",
        tableHead: "问题记录列表",
        modalTitle: "提交新问题"
      },
      th: {
        title: "รายงานปัญหา Non-Standard",
        addBtn: "+ เพิ่มข้อมูล",
        chartHead: "จำนวนปัญหาแบ่งตามรุ่นเครื่องจักร",
        tableHead: "ตารางบันทึกรายการปัญหา",
        modalTitle: "บันทึกแจ้งปัญหาใหม่"
      }
    };

    window.onload = function() {
      fetchData();
      document.getElementById('inp-time').value = new Date().toLocaleString();
    };

    function fetchData() {
      fetch(GAS_URL)
        .then(res => res.json())
        .then(data => {
          rawData = data;
          populateFilters();
          renderData(rawData);
        })
        .catch(err => console.error("Error fetching data:", err));
    }

    function renderData(data) {
      // Table
      const tbody = document.getElementById('table-body');
      tbody.innerHTML = '';
      document.getElementById('row-count').innerText = `${data.length} items`;

      data.forEach(item => {
        const tr = document.createElement('tr');
        tr.className = "hover:bg-gray-50 dark:hover:bg-slate-700/50";
        tr.innerHTML = `
          <td class="p-3">${item['班'] || '-'}</td>
          <td class="p-3">${item['Plant'] || '-'}</td>
          <td class="p-3 font-semibold text-teal-600 dark:text-teal-400">${item['设备型号'] || '-'}</td>
          <td class="p-3 text-xs">${item['调整时间'] || '-'}</td>
          <td class="p-3">${item['Dept.'] || '-'}</td>
          <td class="p-3">${item['发现的问题'] || '-'}</td>
          <td class="p-3 text-center space-x-1">
            ${item['Picture 1'] ? `<a href="${item['Picture 1']}" target="_blank" class="text-blue-500 hover:underline"><i class="fa-solid fa-image"></i> 1</a>` : ''}
            ${item['Picture 2'] ? `<a href="${item['Picture 2']}" target="_blank" class="text-blue-500 hover:underline"><i class="fa-solid fa-image"></i> 2</a>` : ''}
          </td>
        `;
        tbody.appendChild(tr);
      });

      // KPI
      document.getElementById('kpi-total').innerText = data.length;
      document.getElementById('kpi-terahop').innerText = data.filter(d => (d['Plant'] || '').includes('Terahop')).length;
      document.getElementById('kpi-ayutthaya').innerText = data.filter(d => (d['Plant'] || '').includes('Ayutthaya')).length;
      document.getElementById('kpi-other').innerText = data.length - (parseInt(document.getElementById('kpi-terahop').innerText) + parseInt(document.getElementById('kpi-ayutthaya').innerText));

      // Chart
      renderChart(data);
    }

    function renderChart(data) {
      const counts = {};
      data.forEach(d => {
        const model = d['设备型号'] || 'Unknown';
        counts[model] = (counts[model] || 0) + 1;
      });

      const labels = Object.keys(counts);
      const values = Object.values(counts);

      const ctx = document.getElementById('barChart').getContext('2d');
      if (myChart) myChart.destroy();

      myChart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [{
            label: 'Cases',
            data: values,
            backgroundColor: '#00bba7',
            borderRadius: 6
          }]
        },
        options: {
          indexAxis: 'y',
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { color: 'rgba(150,150,150,0.1)' } },
            y: { grid: { display: false } }
          }
        }
      });
    }

    function populateFilters() {
      const plants = [...new Set(rawData.map(d => d['Plant']).filter(Boolean))];
      const depts = [...new Set(rawData.map(d => d['Dept.']).filter(Boolean))];
      const shifts = [...new Set(rawData.map(d => d['班']).filter(Boolean))];

      fillSelect('filter-plant', plants);
      fillSelect('filter-dept', depts);
      fillSelect('filter-shift', shifts);
    }

    function fillSelect(id, items) {
      const select = document.getElementById(id);
      const firstOpt = select.options[0].text;
      select.innerHTML = `<option value="">${firstOpt}</option>`;
      items.forEach(i => {
        select.innerHTML += `<option value="${i}">${i}</option>`;
      });
    }

    function applyFilters() {
      const p = document.getElementById('filter-plant').value;
      const d = document.getElementById('filter-dept').value;
      const s = document.getElementById('filter-shift').value;

      const filtered = rawData.filter(item => {
        return (!p || item['Plant'] === p) &&
               (!d || item['Dept.'] === d) &&
               (!s || item['班'] === s);
      });
      renderData(filtered);
    }

    function resetFilters() {
      document.getElementById('filter-plant').value = '';
      document.getElementById('filter-dept').value = '';
      document.getElementById('filter-shift').value = '';
      renderData(rawData);
    }

    // Modal Control
    function openModal() { document.getElementById('formModal').classList.remove('hidden'); document.getElementById('formModal').classList.add('flex'); }
    function closeModal() { document.getElementById('formModal').classList.add('hidden'); document.getElementById('formModal').classList.remove('flex'); }

    // Form Submit with Base64 Image
    async function submitForm(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-submit');
      btn.disabled = true;
      btn.innerText = 'Submitting...';

      const img1File = document.getElementById('inp-img1').files[0];
      const img2File = document.getElementById('inp-img2').files[0];

      let img1Base64 = "", img2Base64 = "";
      if (img1File) img1Base64 = await toBase64(img1File);
      if (img2File) img2Base64 = await toBase64(img2File);

      const payload = {
        shift: document.getElementById('inp-shift').value,
        plant: document.getElementById('inp-plant').value,
        machineModel: document.getElementById('inp-model').value,
        dept: document.getElementById('inp-dept').value,
        adjustTime: document.getElementById('inp-time').value,
        problemFound: document.getElementById('inp-problem').value,
        picture1Base64: img1Base64,
        picture1Name: img1File ? img1File.name : '',
        picture2Base64: img2Base64,
        picture2Name: img2File ? img2File.name : ''
      };

      fetch(GAS_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(res => {
        alert('Submitted successfully!');
        closeModal();
        fetchData();
      })
      .catch(err => alert('Error submitting: ' + err))
      .finally(() => {
        btn.disabled = false;
        btn.innerText = 'Submit';
      });
    }

    const toBase64 = file => new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => resolve(reader.result);
      reader.onerror = error => reject(error);
    });

    // Language & Theme
    function setLanguage(lang) {
      currentLang = lang;
      document.getElementById('t-title').innerText = dict[lang].title;
      document.getElementById('t-add-btn').innerText = dict[lang].addBtn;
      document.getElementById('t-chart-head').innerText = dict[lang].chartHead;
      document.getElementById('t-table-head').innerText = dict[lang].tableHead;
      document.getElementById('t-modal-title').innerText = dict[lang].modalTitle;

      ['en', 'zh', 'th'].forEach(l => {
        const btn = document.getElementById(`lang-${l}`);
        if(l === lang) btn.className = "px-2.5 py-1 text-xs font-bold bg-teal-600 text-white";
        else btn.className = "px-2.5 py-1 text-xs font-bold bg-gray-700 text-white";
      });
    }

    function toggleTheme() {
      document.documentElement.classList.toggle('dark');
    }

    // Export Functions
    function exportCSV() {
      let csv = 'Shift,Plant,Machine Model,Time,Dept,Problem Found\n';
      rawData.forEach(r => {
        csv += `"${r['班']}","${r['Plant']}","${r['设备型号']}","${r['调整时间']}","${r['Dept.']}","${r['发现的问题']}"\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'Problem_Report.csv';
      a.click();
    }

    function exportImage() {
      html2canvas(document.getElementById('capture-area')).then(canvas => {
        const a = document.createElement('a');
        a.href = canvas.toDataURL('image/png');
        a.download = 'Dashboard.png';
        a.click();
      });
    }

    function exportPDF() {
      const { jsPDF } = window.jspdf;
      html2canvas(document.getElementById('capture-area')).then(canvas => {
        const imgData = canvas.toDataURL('image/png');
        const pdf = new jsPDF('p', 'mm', 'a4');
        const imgWidth = 210;
        const pageHeight = 295;
        const imgHeight = (canvas.height * imgWidth) / canvas.width;
        pdf.addImage(imgData, 'PNG', 0, 0, imgWidth, imgHeight);
        pdf.save('Dashboard.pdf');
      });
    }
  </script>
</body>
</html>
